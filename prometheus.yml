# Prometheus configuration for FlashDB benchmarking
# Scrapes both FlashDB and real Redis (via redis_exporter) for comparison

global:
  scrape_interval: 5s      # Faster scrape for benchmark granularity
  evaluation_interval: 5s

scrape_configs:
  # FlashDB metrics
  - job_name: "flashdb"
    static_configs:
      - targets: ["flashdb:9121"]
    relabel_configs:
      - target_label: "db"
        replacement: "flashdb"

  # Real Redis via redis_exporter (baseline comparison)
  - job_name: "redis"
    static_configs:
      - targets: ["redis_exporter:9121"]
    relabel_configs:
      - target_label: "db"
        replacement: "redis"

  # Prometheus self-monitoring (optional, useful for debugging)
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
